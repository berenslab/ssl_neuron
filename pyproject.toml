[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ssl_neuron"
version = "1.1"
description = "SSL-Neuron contains the code to the paper 'Self-supervised Representation Learning of Neuronal Morphologies'"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Marissa Weis", email = "marissa.weis@bethgelab.org" },
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy",
    "tqdm",
    "seaborn",
    "matplotlib",
    "networkx",
    "jupyterlab>=4.6.3",
    "ipykernel>=7.3.0",
    "fastparquet>=2026.5.0",
]

[project.optional-dependencies]
# GPU training/inference stack.
torch = [
    # <2.10: torch 2.10+ wheels drop Pascal (sm_61, e.g. the cluster's TITAN Xp) kernels.
    "torch>=2.3,<2.10",
    "torchvision>=0.18,<0.25",
    "scikit-learn>=1.4",
    "scipy",
]

# CUDA 12.6 wheels: the last build line that still ships sm_61 kernels, and it runs on
# drivers that only support CUDA 12.8 (the default PyPI wheel needs a newer driver).
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", extra = "torch", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu126", extra = "torch", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
# Note: the original Allen Cell Types Database preprocessing (extract_allen_data.ipynb)
# additionally needs `allensdk` and `pandas`. It's not declared as an extra here because
# allensdk's own old pins (e.g. matplotlib<3.5) would drag those versions into the single
# shared uv lock for every extra. Install it ad hoc instead: `uv pip install allensdk pandas`.

[project.urls]
Homepage = "https://eckerlab.org/code/weis2021b/"

[tool.hatch.build.targets.wheel]
packages = ["ssl_neuron"]
