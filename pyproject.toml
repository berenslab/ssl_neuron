[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ssl_neuron"
version = "1.1"
description = "SSL-Neuron contains the code to the paper 'Self-supervised Representation Learning of Neuronal Morphologies'"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Marissa Weis", email = "marissa.weis@bethgelab.org" },
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy",
    "tqdm",
    "seaborn",
    "matplotlib",
    "networkx",
    "jupyterlab>=4.6.3",
    "ipykernel>=7.3.0",
    "fastparquet>=2026.5.0",
]

[project.optional-dependencies]
# GPU training/inference stack.
torch = [
    "torch>=2.3",
    "torchvision>=0.18",
    "scikit-learn>=1.4",
    "scipy",
]
# Note: the original Allen Cell Types Database preprocessing (extract_allen_data.ipynb)
# additionally needs `allensdk` and `pandas`. It's not declared as an extra here because
# allensdk's own old pins (e.g. matplotlib<3.5) would drag those versions into the single
# shared uv lock for every extra. Install it ad hoc instead: `uv pip install allensdk pandas`.

[project.urls]
Homepage = "https://eckerlab.org/code/weis2021b/"

[tool.hatch.build.targets.wheel]
packages = ["ssl_neuron"]
